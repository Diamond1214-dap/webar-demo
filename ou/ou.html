<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MindAR 影片播放互動</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body, a-scene {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
      }
      #playButton {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
        padding: 10px 20px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <button id="playButton">🔊 啟用聲音</button>
    
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: true;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="introVid" src="viedo.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-light type="ambient" intensity="1.5"></a-light>
      <a-camera look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video
          id="videoEntity"
          src="#introVid"
          width="1.6" height="0.9"
          scale="1 1 1"
          position="0 0 0"
          material="shader: flat"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector('#introVid');
      const videoPlane = document.querySelector('#videoEntity');
      const targetEntity = document.querySelector('a-entity[mindar-image-target]');
      const playButton = document.querySelector('#playButton');

      playButton.addEventListener('click', () => {
        video.muted = false;
        video.play();
        playButton.style.display = 'none';
      });

      targetEntity.addEventListener('targetFound', () => {
        video.play();
      });

      targetEntity.addEventListener('targetLost', () => {
        video.pause();
        video.currentTime = 0;
      });

      videoPlane.addEventListener('click', () => {
        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
      });

      // ✅ 強制重新啟動 MindAR（避免第二次失效）
      window.addEventListener("load", () => {
        const scene = document.querySelector('a-scene');
        if (scene.hasLoaded) {
          scene.components["mindar-image"].start();
        } else {
          scene.addEventListener("loaded", () => {
            scene.components["mindar-image"].start();
          });
        }
      });
    </script>
  </body>
</html>
