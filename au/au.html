<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MindAR 影片播放互動（穩定版）</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      html, body, a-scene {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
      }
      #playButton {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
        padding: 10px 20px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <button id="playButton">🔊 啟用聲音</button>

    <a-scene
      mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: true;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- ✅ 確認 src 路徑正確，並非拼錯 (viedo.mp4 ➜ video.mp4) -->
        <video
          id="introVid"
          src="viedo.mp4"
          preload="auto"
          loop
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-light type="ambient" intensity="1.5"></a-light>
      <a-camera look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- ✅ 改用 a-plane，比 a-video 更穩定 -->
        <a-plane
          id="videoEntity"
          src="#introVid"
          width="1.6"
          height="0.9"
          position="0 0 0"
          material="shader: flat"
        ></a-plane>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector('#introVid');
      const playButton = document.querySelector('#playButton');
      const targetEntity = document.querySelector('a-entity[mindar-image-target]');
      const videoPlane = document.querySelector('#videoEntity');

      // ✅ 播放按鈕邏輯
      playButton.addEventListener('click', () => {
        video.muted = false;
        video.play();
        playButton.style.display = 'none';
      });

      // ✅ 目標圖像偵測事件
      targetEntity.addEventListener('targetFound', () => {
        console.log('🎯 圖像已找到！播放影片');
        video.play();
      });

      targetEntity.addEventListener('targetLost', () => {
        console.log('🚫 圖像遺失，影片暫停');
        video.pause();
        video.currentTime = 0;
      });

      // ✅ 點擊影片區塊播放或暫停
      videoPlane.addEventListener('click', () => {
        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
      });

      // ✅ 確認影片載入狀況
      video.addEventListener('loadeddata', () => {
        console.log("✅ 影片已成功載入！");
      });

      video.addEventListener('error', (e) => {
        console.error("❌ 影片載入錯誤", e);
      });

      // ✅ MindAR 啟動控制
      window.addEventListener("load", () => {
        const scene = document.querySelector('a-scene');
        if (scene.hasLoaded) {
          scene.components["mindar-image"].start();
        } else {
          scene.addEventListener("loaded", () => {
            scene.components["mindar-image"].start();
          });
        }
      });
    </script>
  </body>
</html>
